specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: Management
    network: sepolia
    source:
      address: "0x732D55203CD9bd474d1125aeca18619c8bebA55F"
      abi: Management
      startBlock: 10179711
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Artist
        - ArtistEvent
        - PlatformStats
      abis:
        - name: Management
          file: Management/Management.json
      eventHandlers:
        - event: ArtistAdded(indexed address,indexed address,uint256)
          handler: handleArtistAdded
        - event: ArtistRemoved(indexed address,indexed address,uint256)
          handler: handleArtistRemoved
      file: Management/Management.wasm
  - kind: ethereum
    name: AlbumFactory
    network: sepolia
    source:
      address: "0x05ffd27905dcAC3171Ccc80d40eDaF93DB523c3B"
      abi: AlbumFactory
      startBlock: 10179711
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Album
        - Artist
        - PlatformStats
      abis:
        - name: AlbumFactory
          file: AlbumFactory/AlbumFactory.json
        - name: HarmonyNFT
          file: AlbumFactory/HarmonyNFT.json
      eventHandlers:
        - event: AlbumCreated(indexed address,indexed address,string,string,uint256)
          handler: handleAlbumCreated
      file: AlbumFactory/AlbumFactory.wasm
templates:
  - kind: ethereum
    name: HarmonyNFT
    network: sepolia
    source:
      abi: HarmonyNFT
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Song
        - Album
        - Transfer
      abis:
        - name: HarmonyNFT
          file: HarmonyNFT/HarmonyNFT.json
      eventHandlers:
        - event: SongMinted(indexed uint256,indexed address,string,uint256)
          handler: handleSongMinted
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: templates/HarmonyNFT/HarmonyNFT.wasm
