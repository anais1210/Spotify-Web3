# Artist entity - represents a music artist on the platform
type Artist @entity(immutable: false) {
  id: Bytes! # address
  address: Bytes!
  isActive: Boolean! # true if currently an artist, false if removed
  addedBy: Bytes # admin who added them
  addedAt: BigInt # when they were added
  removedAt: BigInt # when they were removed (if applicable)
  albums: [Album!]! @derivedFrom(field: "artist")
  totalAlbums: BigInt!
  totalSongs: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
}

# Album entity - represents an album (HarmonyNFT contract)
type Album @entity(immutable: false) {
  id: Bytes! # album contract address
  address: Bytes!
  name: String!
  symbol: String!
  artist: Artist!
  songs: [Song!]! @derivedFrom(field: "album")
  totalSongs: BigInt!
  createdAt: BigInt!
  createdAtBlock: BigInt!
  transactionHash: Bytes!
}

# Song entity - represents a song NFT within an album
type Song @entity(immutable: false) {
  id: ID! # album address + token id
  tokenId: BigInt!
  album: Album!
  owner: Bytes!
  uri: String!
  createdAt: BigInt!
  createdAtBlock: BigInt!
  transactionHash: Bytes!
}

# Transfer entity - tracks ownership changes
type Transfer @entity(immutable: true) {
  id: Bytes!
  album: Bytes!
  tokenId: BigInt!
  from: Bytes!
  to: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Artist management events - tracks when artists are added/removed
type ArtistEvent @entity(immutable: true) {
  id: Bytes!
  artist: Bytes!
  eventType: String! # "ADDED" or "REMOVED"
  admin: Bytes! # who performed the action
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Global stats for the platform
type PlatformStats @entity(immutable: false) {
  id: ID! # "platform"
  totalArtists: BigInt! # active artists count
  totalAlbums: BigInt!
  totalSongs: BigInt!
  totalTransfers: BigInt!
}
