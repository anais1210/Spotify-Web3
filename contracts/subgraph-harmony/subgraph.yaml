specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Harmony
    network: sepolia
    source:
      address: "0x237ACDED68c96A38968319942420C4D012e874Df"
      abi: Harmony
      startBlock: 10147408
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Upgraded
      abis:
        - name: Harmony
          file: ./abis/Harmony.json
      eventHandlers:
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/harmony.ts
  - kind: ethereum
    name: ERC1967Proxy
    network: sepolia
    source:
      address: "0x9cECFa077a22cacaA1Fc039548c7cFDc8c624946"
      abi: ERC1967Proxy
      startBlock: 10147406
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ERC1967ProxyUpgraded
      abis:
        - name: ERC1967Proxy
          file: ./abis/ERC1967Proxy.json
      eventHandlers:
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/erc-1967-proxy.ts
  - kind: ethereum
    name: AlbumFactory
    network: sepolia
    source:
      address: "0x173Df2b5669a7b1F44b8739ADf6A876421b0f5fD"
      abi: AlbumFactory
      startBlock: 10147410
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Album
      abis:
        - name: AlbumFactory
          file: ./abis/AlbumFactory.json
      eventHandlers:
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/album-factory.ts
