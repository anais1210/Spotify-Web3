specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Harmony
    network: sepolia
    source:
      address: "0x237ACDED68c96A38968319942420C4D012e874Df"
      abi: Harmony
      startBlock: 10147408
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Upgraded
      abis:
        - name: Harmony
          file: ./abis/Harmony.json
      eventHandlers:
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/harmony.ts
